# Fast end-to-end smoke test (minutes). Results are meaningless by design.
name: smoke
seed: 0
paths:
  data_dir: data
  out_dir: outputs/smoke
data:
  pathmnist_size: 128
  camelyon_size: 96
  # sub-dataset size is NOT decided yet (set after Phase 0 benchmark)
  subset:
    pathmnist_train_frac: null
    camelyon_max_train: null
    camelyon_max_per_ood_hospital: null
model:
  arch: resnet18
  pretrained: false
  num_classes: 9
train:
  seeds: [0]
  epochs: 1
  early_stopping: {metric: val_loss, patience: 3}
  batch_size: 128
  grad_accum: 1
  amp: true
  channels_last: true
  max_train_images: 2000
bench:
  n_images: 2000
  sustained_seconds: 20
  sample_period_s: 5
  temp_stop_c: 99
  start_temp_c: 60
  cooldown_max_s: 300
  min_free_ram_gb: 6
stages: [0]   # stages enabled so far (placeholders for later phases)
